# Prometheus with kube-state-metrics and Alertmanager (chart prometheus-community/prometheus 30.0.1, Prometheus v3.16.0).
# node-exporter runs on the servers (atmos-ansible).
# Secrets created by hand (README): see the comments in the values.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      version: "30.0.1"          # pinned chart version
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  upgrade:
    remediation:
      retries: 2
  values:
    server:
      retention: 3d
      # Data on the disk of one node (local-path), so the pod is pinned to that node.
      nodeSelector:
        kubernetes.io/hostname: k8s-w1
      persistentVolume:
        size: 5Gi
      # CA of the platform (public certificate), for the targets behind Traefik over HTTPS.
      # ConfigMap created by hand from ~/.atmos/pki/ca.crt (see the README).
      extraConfigmapMounts:
        - name: atmos-ca
          configMap: atmos-ca
          mountPath: /etc/atmos-ca
          readOnly: true
      # Password of the read-only Nexus user prometheus-metrics (Secret created by hand from Ansible Vault).
      extraSecretMounts:
        - name: nexus-metrics
          secretName: nexus-metrics
          mountPath: /etc/nexus-metrics
          readOnly: true
      # Memory request = limit (RAM table in docs/on-premise/architecture.md); CPU request only.
      resources:
        requests:
          cpu: 100m
          memory: 600Mi
        limits:
          memory: 600Mi

    configmapReload:
      prometheus:
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            memory: 20Mi

    kube-state-metrics:
      enabled: true
      # Planned in the RAM of k8s-w1; k8s-cp keeps its memory for Flux.
      nodeSelector:
        kubernetes.io/hostname: k8s-w1
      resources:
        requests:
          cpu: 20m
          memory: 100Mi
        limits:
          memory: 100Mi

    # Alertmanager: one small replica, sends the alerts to Telegram.
    # No volume: after a restart silences are lost and an open alert may be sent once more.
    alertmanager:
      enabled: true
      persistence:
        enabled: false
      nodeSelector:
        kubernetes.io/hostname: k8s-w1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 64Mi
      # Bot token: Secret created by hand from Ansible Vault (see the README).
      extraSecretMounts:
        - name: telegram
          secretName: alertmanager-telegram
          mountPath: /etc/alertmanager/telegram
          readOnly: true
      config:
        route:
          receiver: telegram
          group_by: [alertname, server]   # one message per problem and server
          group_wait: 30s                 # wait for related alerts before the first message
          group_interval: 5m              # new alerts of an open group at most every 5 minutes
          repeat_interval: 4h             # reminder while the problem lasts
        receivers:
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/telegram/token
                chat_id: 705885543        # private chat with the bot @atmos_alerts_bot (not a secret)
                send_resolved: true       # message when the problem is gone
    prometheus-pushgateway:
      enabled: false
    prometheus-node-exporter:
      enabled: false

    # node-exporter on the four servers (installed by atmos-ansible, port 9100 open for the cluster nodes).
    extraScrapeConfigs: |
      - job_name: node-exporter
        static_configs:
          - targets: ["192.168.0.51:9100"]
            labels: {server: k8s-cp}
          - targets: ["192.168.0.52:9100"]
            labels: {server: k8s-w1}
          - targets: ["192.168.0.53:9100"]
            labels: {server: nexus-traefik}
          - targets: ["192.168.0.54:9100"]
            labels: {server: jenkins}
      # Host PC (Windows): windows_exporter, firewall open only to the cluster nodes.
      - job_name: windows-exporter
        static_configs:
          - targets: ["192.168.0.226:9182"]
            labels: {server: host-pc}
        # windows_exporter 0.32 renamed windows_cpu_time_total; the dashboard (24390, for 0.31) still uses the old name.
        # Remove this rule when the dashboard supports the new name.
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: windows_cpu_time_seconds_total
            target_label: __name__
            replacement: windows_cpu_time_total
      # Docker Engine on the servers outside the cluster.
      - job_name: docker
        static_configs:
          - targets: ["192.168.0.53:9323"]
            labels: {server: nexus-traefik}
          - targets: ["192.168.0.54:9323"]
            labels: {server: jenkins}
      # Traefik on nexus-traefik (metrics entry point).
      - job_name: traefik
        static_configs:
          - targets: ["192.168.0.53:9110"]
            labels: {server: nexus-traefik}
      # Jenkins through Traefik; /prometheus is allowed only from the cluster nodes.
      - job_name: jenkins
        scheme: https
        metrics_path: /prometheus/
        tls_config:
          ca_file: /etc/atmos-ca/ca.crt
        static_configs:
          - targets: ["jenkins.atmos.lan"]
            labels: {server: jenkins}
      # Nexus through Traefik, as the read-only user prometheus-metrics (privilege nx-metrics-all).
      - job_name: nexus
        scheme: https
        metrics_path: /service/metrics/prometheus
        basic_auth:
          username: prometheus-metrics
          password_file: /etc/nexus-metrics/password
        tls_config:
          ca_file: /etc/atmos-ca/ca.crt
        static_configs:
          - targets: ["nexus.atmos.lan"]
            labels: {server: nexus-traefik}

    # Alert rules. Every alert has the label server (or the labels of the object), so Alertmanager groups by it.
    serverFiles:
      alerting_rules.yml:
        groups:
          - name: atmos
            rules:
              - alert: TargetDown
                expr: up == 0
                for: 5m
                labels: {severity: critical}
                annotations:
                  summary: "{{ $labels.job }} on {{ $labels.server }} ({{ $labels.instance }}) does not answer Prometheus"

              - alert: DiskFreeLow
                expr: |
                  node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes < 0.15
                  or windows_logical_disk_free_bytes{volume=~"[A-Z]:"} / windows_logical_disk_size_bytes < 0.15
                for: 10m
                labels: {severity: warning}
                annotations:
                  summary: "{{ $labels.server }}: less than 15 % free on {{ $labels.mountpoint }}{{ $labels.volume }} ({{ $value | humanizePercentage }})"

              # Servers only: the host PC is near its memory limit by design (the VMs take most of it).
              - alert: MemoryHigh
                expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
                for: 10m
                labels: {severity: warning}
                annotations:
                  summary: "{{ $labels.server }}: memory used above 90 % for 10 minutes ({{ $value | humanizePercentage }})"

              - alert: NodeNotReady
                expr: kube_node_status_condition{condition="Ready", status="true"} == 0
                for: 5m
                labels: {severity: critical}
                annotations:
                  summary: "Cluster node {{ $labels.node }} is not Ready"

              - alert: PodRestartingLoop
                expr: increase(kube_pod_container_status_restarts_total[15m]) > 2
                labels: {severity: warning}
                annotations:
                  summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }} times in 15 minutes"

              # Server certificate of the platform, as served by Traefik on nexus-traefik.
              - alert: CertificateExpiringSoon
                expr: (traefik_tls_certs_not_after{job="traefik"} - time()) / 86400 < 30
                labels: {severity: warning}
                annotations:
                  summary: "Certificate {{ $labels.cn }} expires in {{ $value | humanize }} days: renew it with Ansible (README of atmos-ansible)"

              # Result of the last build of each job: 0 success, 1 unstable, 2 failure. Resolved by the next good build.
              - alert: JenkinsBuildFailed
                expr: default_jenkins_builds_last_build_result_ordinal == 2
                labels: {severity: warning}
                annotations:
                  summary: "Jenkins job {{ $labels.jenkins_job }}: the last build failed"
