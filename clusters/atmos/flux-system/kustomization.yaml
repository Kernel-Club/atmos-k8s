apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Git access through the GitHub App atmos-flux (installed only on atmos-k8s) instead of the bootstrap token.
# A patch here, because flux bootstrap overwrites gotk-sync.yaml.
patches:
- target:
    kind: GitRepository
    name: flux-system
  patch: |
    - op: add
      path: /spec/provider
      value: github
    - op: replace
      path: /spec/secretRef/name
      value: flux-github-app
# Memory request = limit for each controller (budget of Flux on k8s-cp: 0.7 GB); the defaults are 64Mi / 1Gi.
- target:
    kind: Deployment
    name: source-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: source-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 192Mi
                limits:
                  memory: 192Mi
- target:
    kind: Deployment
    name: helm-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: helm-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 160Mi
                limits:
                  memory: 160Mi
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kustomize-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 96Mi
                limits:
                  memory: 96Mi
- target:
    kind: Deployment
    name: image-reflector-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: image-reflector-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 96Mi
                limits:
                  memory: 96Mi
- target:
    kind: Deployment
    name: image-automation-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: image-automation-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 96Mi
                limits:
                  memory: 96Mi
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notification-controller
    spec:
      template:
        spec:
          containers:
            - name: manager
              resources:
                requests:
                  memory: 64Mi
                limits:
                  memory: 64Mi
