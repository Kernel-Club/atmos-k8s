# One address for the browser: /api to the backend, everything else to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atmos
  labels:
    app.kubernetes.io/part-of: atmos
  annotations:
    # Security headers (security-headers.yaml): Middleware <namespace>-<name> of the Traefik CRDs.
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
