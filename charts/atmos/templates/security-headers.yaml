# Security headers of every answer (page and API), added by Traefik of the cluster (k3s).
# Found missing by the ZAP baseline scan after a deploy (develop-cd-checks in Jenkins).
# The app loads nothing from other sites, so everything is limited to its own origin.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    app.kubernetes.io/part-of: atmos
spec:
  headers:
    frameDeny: true                 # X-Frame-Options: DENY (no clickjacking in a frame)
    contentTypeNosniff: true        # X-Content-Type-Options: nosniff
    referrerPolicy: no-referrer
    contentSecurityPolicy: "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
      Cross-Origin-Resource-Policy: same-origin
