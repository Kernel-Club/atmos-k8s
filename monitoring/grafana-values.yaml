# Values of the grafana chart (version pinned in the README).
# Everything is provisioned from this file, so Grafana needs no volume: a new pod comes up configured.

# Admin login from a Secret created by hand (keys admin-user, admin-password).
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

ingress:
  enabled: true
  ingressClassName: traefik
  hosts: [grafana.atmos.lan]

# Memory request = limit; CPU request only. 250Mi was killed (OOM) at the first start of Grafana 13; 400Mi reached 382Mi.
resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    memory: 512Mi

# Planned in the RAM of k8s-w1; k8s-cp keeps its memory for Flux.
nodeSelector:
  kubernetes.io/hostname: k8s-w1

# No plugins installed at start (Drilldown apps etc.): not used, they cost memory and CPU.
grafana.ini:
  plugins:
    preinstall_disabled: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc
        isDefault: true
        jsonData:
          # Scrape interval of Prometheus (chart default 1m): rate() panels need at least two samples in their window.
          timeInterval: 1m

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        folder: Atmos
        type: file
        options:
          path: /var/lib/grafana/dashboards/default

# Community dashboards from grafana.com, downloaded at start; revision pinned (without it the chart takes revision 1).
dashboards:
  default:
    servers:            # Node Exporter Full: CPU, memory, disk, network of the four servers
      gnetId: 1860
      revision: 46
      datasource: Prometheus
    cluster:            # Kubernetes / Views / Global
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    nodes:              # Kubernetes / Views / Nodes
      gnetId: 15759
      revision: 40
      datasource: Prometheus
    pods:               # Kubernetes / Views / Pods (application pods in the namespace atmos)
      gnetId: 15760
      revision: 41
      datasource: Prometheus
