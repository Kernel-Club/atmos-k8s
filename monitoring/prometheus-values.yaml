# Values of the prometheus-community/prometheus chart (version pinned in the README).
# Prometheus with kube-state-metrics; node-exporter runs on the servers (atmos-ansible), Alertmanager comes later.

server:
  retention: 3d
  # Data on the disk of one node (local-path), so the pod is pinned to that node.
  nodeSelector:
    kubernetes.io/hostname: k8s-w1
  persistentVolume:
    size: 5Gi
  # CA of the platform (public certificate), for the targets behind Traefik over HTTPS.
  # ConfigMap created by hand from ~/.atmos/pki/ca.crt (see the README).
  extraConfigmapMounts:
    - name: atmos-ca
      configMap: atmos-ca
      mountPath: /etc/atmos-ca
      readOnly: true
  # Password of the read-only Nexus user prometheus-metrics (Secret created by hand from Ansible Vault).
  extraSecretMounts:
    - name: nexus-metrics
      secretName: nexus-metrics
      mountPath: /etc/nexus-metrics
      readOnly: true
  # Memory request = limit (RAM table in docs/on-premise/architecture.md); CPU request only.
  resources:
    requests:
      cpu: 100m
      memory: 600Mi
    limits:
      memory: 600Mi

configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        memory: 20Mi

kube-state-metrics:
  enabled: true
  # Planned in the RAM of k8s-w1; k8s-cp keeps its memory for Flux.
  nodeSelector:
    kubernetes.io/hostname: k8s-w1
  resources:
    requests:
      cpu: 20m
      memory: 100Mi
    limits:
      memory: 100Mi

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false

# node-exporter on the four servers (installed by atmos-ansible, port 9100 open for the cluster nodes).
extraScrapeConfigs: |
  - job_name: node-exporter
    static_configs:
      - targets: ["192.168.0.51:9100"]
        labels: {server: k8s-cp}
      - targets: ["192.168.0.52:9100"]
        labels: {server: k8s-w1}
      - targets: ["192.168.0.53:9100"]
        labels: {server: nexus-traefik}
      - targets: ["192.168.0.54:9100"]
        labels: {server: jenkins}
  # Host PC (Windows): windows_exporter, firewall open only to the cluster nodes.
  - job_name: windows-exporter
    static_configs:
      - targets: ["192.168.0.226:9182"]
        labels: {server: host-pc}
  # Docker Engine on the servers outside the cluster.
  - job_name: docker
    static_configs:
      - targets: ["192.168.0.53:9323"]
        labels: {server: nexus-traefik}
      - targets: ["192.168.0.54:9323"]
        labels: {server: jenkins}
  # Traefik on nexus-traefik (metrics entry point).
  - job_name: traefik
    static_configs:
      - targets: ["192.168.0.53:9110"]
        labels: {server: nexus-traefik}
  # Jenkins through Traefik; /prometheus is allowed only from the cluster nodes.
  - job_name: jenkins
    scheme: https
    metrics_path: /prometheus/
    tls_config:
      ca_file: /etc/atmos-ca/ca.crt
    static_configs:
      - targets: ["jenkins.atmos.lan"]
        labels: {server: jenkins}
  # Nexus through Traefik, as the read-only user prometheus-metrics (privilege nx-metrics-all).
  - job_name: nexus
    scheme: https
    metrics_path: /service/metrics/prometheus
    basic_auth:
      username: prometheus-metrics
      password_file: /etc/nexus-metrics/password
    tls_config:
      ca_file: /etc/atmos-ca/ca.crt
    static_configs:
      - targets: ["nexus.atmos.lan"]
        labels: {server: nexus-traefik}
