# Trivy findings in the Helm chart that are accepted on purpose (US-07).
# Paths are relative to charts/atmos. After expired_at the finding is reported again:
# review the decision, then extend the date or fix the finding.
misconfigurations:
  - id: KSV-0011
    statement: >-
      No CPU limit on purpose: a limit throttles the pods on small VMs.
      CPU requests are set, memory request = limit.
    expired_at: 2027-05-28

  - id: KSV-0020
    paths:
      - templates/mongodb.yaml
      - templates/redis.yaml
    statement: >-
      UID 999 is the user of the official mongo and redis images; files in the images belong to it.
      The pods run as non-root with a read-only filesystem and no capabilities.
    expired_at: 2027-05-28

  - id: KSV-0021
    paths:
      - templates/mongodb.yaml
      - templates/redis.yaml
    statement: >-
      GID 999 is the group of the official mongo and redis images (see KSV-0020).
    expired_at: 2027-05-28

  - id: KSV-0110
    statement: >-
      The chart sets no namespace; the HelmRelease installs it into the atmos namespace.
    expired_at: 2027-05-28

  - id: KSV-0125
    paths:
      - templates/backend.yaml
      - templates/frontend.yaml
      - templates/mongodb.yaml
      - templates/redis.yaml
    statement: >-
      The check does not know our registries. backend and frontend come from our Nexus
      (built and scanned by Jenkins); mongo and redis are official Docker Hub images pinned
      to an exact version. A new workload file is not covered and is reported.
    expired_at: 2027-05-28
